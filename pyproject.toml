[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbagg"
version = "0.3.1"
description = "Asistente interno de WhatsApp y reportes sobre SQL Server"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  # FastAPI only requires starlette>=0.46; pinned so the audited version is installed.
  "starlette==1.10.0",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
  "certifi>=2026.10.19",
  "openai==1.78.1",
  "pyodbc==5.3.0",
  "python-dotenv==1.2.4",
  "sqlglot==26.16.4",
  "numpy==2.4.6",
  "pandas==3.0.6",
  "tzdata==2026.5",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "build==1.6.1", "pip-audit==2.10.1", "pypdf==6.21.4"]

[project.scripts]
dbagg-report = "dbagg.reporting.cli:main"
dbagg-context = "dbagg.context.loader:main"
dbagg-eval = "dbagg.evaluation.cli:main"
dbagg-llm = "dbagg.llm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dbagg*"]

[tool.setuptools.package-data]
"dbagg.context" = ["default.json"]
"dbagg.database" = ["catalog.json"]
"dbagg.business" = ["units.json"]
"dbagg.reporting" = ["templates/*.html", "static/*.js"]
"dbagg.agent" = ["templates/*.md", "templates/*.json"]
"dbagg.llm" = ["default.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
