name: checks
on:
  pull_request:
  push:
    branches: [main, whatsapp-openai, refactor]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: python -m pip install -r requirements.txt -e '.[dev]'
      - run: python -m ruff check src tests scripts whatsapp_agent.py score_riesgo.py business_context.py
      - run: python -m ruff format --check src tests scripts whatsapp_agent.py score_riesgo.py business_context.py
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/smoke_wheel.py
