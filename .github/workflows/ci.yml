name: checks
on:
  pull_request:
  push:
    branches: [main, whatsapp-openai]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: python -m pip install -r requirements.txt -e '.[dev]'
      - run: python -m ruff check dbagg tests whatsapp_agent.py score_riesgo.py business_context.py
      - run: python -m ruff format --check dbagg tests whatsapp_agent.py score_riesgo.py business_context.py
      - run: python -m unittest discover -s tests -v
      - run: python -m build
