name: dbagg

services:
  dbagg:
    build: .
    image: dbagg:local
    restart: unless-stopped
    # Host-only: the tunnel reaches it locally, the rest of the network does not.
    ports:
      - "127.0.0.1:8000:8000"
    # .env is mounted, not passed with env_file, so python-dotenv parses its quotes as usual.
    volumes:
      - ./.env:/srv/dbagg/.env:ro
      - ./config:/srv/dbagg/config:ro
      - dbagg-data:/srv/dbagg/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Started with --profile tunnel; the hostname is configured in the Cloudflare dashboard.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      dbagg:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dbagg-data:
    name: dbagg-data
